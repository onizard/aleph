name: APK Android
on:
  push:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: sudo apt-get install -y imagemagick >/dev/null
      - run: bash android/build.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: Aleph pour Android
          body: "Télécharger aleph.apk ci-dessous, puis l'ouvrir sur le téléphone Android pour l'installer."
          files: android/aleph.apk
          make_latest: true
